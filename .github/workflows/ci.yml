name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

env:
  NODE_VERSION: 24.16.0
  PNPM_VERSION: 10.0.0
  DATABASE_URL: postgresql://payload:payload@127.0.0.1:5432/payload_test
  PAYLOAD_SECRET: ci-payload-secret
  NEXT_TELEMETRY_DISABLED: '1'
  CI: 'true'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: payload_test
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
        options: >-
          --health-cmd "pg_isready -U payload -d payload_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated Payload types
        run: |
          pnpm run generate:types
          git diff --exit-code -- src/payload-types.ts

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Integration tests
        run: pnpm run test:int

      - name: Build
        run: pnpm run build
